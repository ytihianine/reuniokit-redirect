<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirection</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Redirection</h1>
    <p class="intro">
      Cette page vérifie si l'un des sites ci-dessous est disponible.
      Dès qu'un site répond, cliquez sur le bouton pour y accéder.
    </p>
    <ul id="probe-list"></ul>
    <p class="cta">Cliquez sur le bouton pour être redirigé vers le site fonctionnel.</p>
    <button id="go-button" type="button" disabled>Rediriger vers le site fonctionnel</button>
    <p class="contact">
      Si aucun site ne fonctionne, merci de contacter
      <a id="contact-link" href="mailto:support@exemple.com">support@exemple.com</a>.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
